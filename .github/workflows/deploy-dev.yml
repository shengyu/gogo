name: Deploy dev

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-dev.yml
      - Dockerfile
      - go.mod
      - go.sum
      - cmd/**
      - internal/**

permissions:
  contents: write

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  IMAGE_NAME: usungu/gogo

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: usungu
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=dev-${{ github.sha }}
            COMMIT=${{ github.sha }}
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update dev image version
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          sed -i.bak -E "s|^(    newName: ).*|\\1${IMAGE_NAME}|" deploy/overlays/dev/kustomization.yaml
          sed -i.bak -E "s|^(    newTag: ).*|\\1${IMAGE_TAG}|" deploy/overlays/dev/kustomization.yaml
          rm -f deploy/overlays/dev/kustomization.yaml.bak

          if git diff --quiet; then
            echo "Dev already references ${IMAGE_TAG}"
            exit 0
          fi

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/dev/kustomization.yaml
          git commit -m "chore(deploy): update dev to ${IMAGE_TAG} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
